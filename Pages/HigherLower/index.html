<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Higher/Lower</title>
    <link rel="icon" href="/Icons/mont.png">
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  
  <body>
    <header>
      <h1>Let's Play The Higher-Lower Game!</h1>
      <h3>Guess The Magic Number Between 1 and 100.</h3>
      <h6>
        <span id="remining-guesses">5</span> 
        Guesses Remaining.
      </h6>
    </header>

    <main>
      <form id="guess-form" onsubmit="handleGuess(); return false;">
        <label for="guess-input">Enter your guess:</label>
        <input id="guess-input" type="number" min="1" max="100" required aria-label="Enter your guess between 1 and 100">
        <button type="submit" class='btn btn-color'>Make Guess</button>
      </form>

      <div id="message-container">
        <div id="higher-message" class="hidden" role="alert">Higher ⬆️</div>
        <div id="lower-message" class="hidden" role="alert">Lower ⬇️</div>
        <div id="win-message" class="hidden" role="alert">
          <img src='winner.png' alt="Winner celebration" class='winner'>
          <button onclick='handlePlayAgain()' class='btn btn-color' id='playAgain'>Play Again!</button>
        </div>
        <div id="lose-message" class="hidden" role="alert">
          <img src='gameOver.png' alt="Game over" class='loser'>
          <button onclick='handlePlayAgain()' class='btn btn-color' id='playAgain'>Play Again!</button>
        </div>
      </div>
    </main>

    <footer>
      <div id="wrapper">
        <button class="btn button" id="homeSite" aria-label="Return to main site">Back to Site</button>
      </div>
    </footer>
    
    <script src="provided.js"></script>
    <script src="script.js"></script>
  </body>
</html>
